# config.yaml — QuantOS Market Data Pipeline
# All keys have fallback defaults in pipeline.py

# ---- Fetch settings ----
data_dir:  "./data"
interval:  "1d"           # yfinance: 1m 5m 1h 1d 1wk 1mo
use_cache: true           # skip re-download if raw CSV already exists

# ---- Cleaning settings ----
timezone:        "US/Eastern"
target_freq:     "D"      # pandas offset alias
resample_method: "ffill"
fill_method:     "ffill"
max_gap:         5        # max consecutive NaN bars to fill
return_method:   "log"    # "log" (preferred) or "simple"

# ---- Feature engineering ----
features:
  volatility:
    windows: [5, 21, 63]  # trading days: ~1wk, ~1mo, ~1qtr
  rsi:
    window: 14             # Wilder's standard
  atr:
    window: 14             # Wilder's standard
  volume:
    window: 20             # rolling average for vol_ratio and VWAP
  bollinger:
    window:  20
    num_std: 2.0           # bands at ±2 sigma
  macd:
    fast:   12
    slow:   26
    signal: 9              # classic 12/26/9 configuration
  price_zscore:
    windows: [20, 60]      # short (mean-reversion) and medium (trend)

# ---- Symbol watchlist ----
watchlist:
  - AAPL
  - GOOGL
  - MSFT
  - SPY
  - "^GSPC"               # S&P 500 index

# ---- Signal generation ----
signals:
  rsi:
    oversold:   30
    overbought: 70
    exit:       50
    smoothing:  1       # bars RSI must stay beyond threshold before confirming
  macd:
    require_zero_cross: false
  zscore:
    entry_threshold: 2.0
    exit_threshold:  0.0
    window:          60   # use z_price_60d column
  bollinger:
    squeeze_percentile: 20.0
    max_holding_bars:   10
  vol_scale:
    window:   21
    lookback: 252
    floor:    0.0
    ceiling:  2.0
  holding:
    min_bars: 2    # ignore exits within N bars of entry (avoids whipsaws)
    max_bars: 20   # force exit after N bars regardless of signal
  ensemble:
    method: "majority_vote"   # majority_vote | weighted | regime_switch